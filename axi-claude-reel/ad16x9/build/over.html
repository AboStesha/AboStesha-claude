<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/local.css">
<link rel="stylesheet" href="../../fonts/serif_local.css">
<style>
:root{--gold:#E9C46A;--gold2:#F6D98B;--red:#E4002B;--mint:#3BE8B0;--ink:#0B0C0E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
body{font-family:'Alexandria',sans-serif;color:#fff}
.abs{position:absolute}
.ar{direction:rtl}
.en{font-family:'Inter',sans-serif;direction:ltr}
.serif{font-family:'Source Serif 4',serif}
#bug{left:58px;top:46px;height:52px;opacity:.82}
#loc{right:70px;top:60px;text-align:right;direction:rtl}
#loc .city{font-weight:800;font-size:46px;letter-spacing:1px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#loc .time{font-weight:500;font-size:26px;color:rgba(255,255,255,.75);margin-top:4px}
#loc .rule{height:2px;background:linear-gradient(90deg,transparent,var(--gold));margin-top:12px}
#sub{left:160px;right:160px;bottom:66px;text-align:center;direction:rtl;font-weight:600;font-size:52px;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 24px rgba(0,0,0,.6)}
#mt{left:0;right:0;bottom:78px;text-align:center}
#mt .en{font-weight:600;font-size:24px;letter-spacing:10px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.8),0 2px 12px rgba(0,0,0,.8)}
#mt .ttl{direction:rtl;font-weight:800;font-size:76px;color:var(--gold2);margin-top:6px;text-shadow:0 2px 3px rgba(0,0,0,.55),0 4px 22px rgba(0,0,0,.85),0 0 34px rgba(233,196,106,.35)}
#mt .rule{margin:14px auto 0;height:2px;width:420px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
/* UI scene */
#ui{inset:0;background:radial-gradient(1200px 700px at 50% 45%,#2a1a08 0%,#120c06 45%,#050505 100%)}
#ui canvas{position:absolute;inset:0}
#uiHead{left:0;right:0;top:70px;display:flex;justify-content:center;align-items:center;gap:30px}
#uiHead .cl{display:flex;align-items:center;gap:16px;font-size:64px;font-weight:600}
#uiHead .x{font-family:'Inter';font-weight:600;font-size:44px;color:rgba(255,255,255,.55)}
#uiHead img.ai{height:76px;border-radius:18px}
#card{left:370px;top:220px;width:1180px;height:640px;border-radius:34px;background:rgba(22,20,18,.82);border:1.5px solid rgba(255,255,255,.12);box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 80px rgba(233,196,106,.12);backdrop-filter:blur(8px);overflow:hidden}
#card .hdr{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid rgba(255,255,255,.08)}
#card .hdr .l{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:600}
#card .chip{direction:rtl;display:flex;align-items:center;gap:12px;background:rgba(59,232,176,.1);border:1px solid rgba(59,232,176,.35);border-radius:30px;padding:8px 18px;font-size:22px;font-weight:500}
#card .chip .g{width:12px;height:12px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
#ub{right:40px;top:116px;max-width:1080px;white-space:nowrap;direction:rtl;background:#2E2A26;border-radius:28px;padding:20px 30px;font-size:30px;font-weight:500}
#tool{right:44px;top:210px;direction:ltr;font-family:'Inter';font-size:20px;color:#a99;display:flex;gap:10px;align-items:center}
#ans{right:40px;top:262px;width:760px;direction:rtl;font-size:27px;line-height:1.6;color:#eee}
#ans div{margin-bottom:10px}
#spark{left:40px;top:300px;width:330px;height:220px}
/* tagline */
#tag{left:120px;top:300px;width:1240px;direction:rtl;text-align:right;white-space:nowrap}
#tag .l1{font-weight:500;font-size:44px;color:rgba(255,255,255,.85);text-shadow:0 2px 14px rgba(0,0,0,.6)}
#tag .l2{font-weight:900;font-size:104px;line-height:1.15;text-shadow:0 4px 24px rgba(0,0,0,.55)}
#tag .rule{height:4px;width:0;background:linear-gradient(270deg,var(--gold),transparent);margin-top:10px;margin-right:0;margin-left:auto}
/* end card */
#end{inset:0;background:radial-gradient(1000px 520px at 50% 40%,#17181b 0%,#0b0c0e 60%,#060607 100%)}
#grid{inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:96px 96px}
#chart{inset:0}
#lock{left:0;right:0;top:250px;display:flex;justify-content:center;align-items:center;gap:56px;direction:ltr}
#lock .cl{display:flex;align-items:center;gap:18px;font-size:92px;font-weight:600;color:#fff}
#lock .cl img{width:96px;height:96px}
#lock .x{font-family:'Inter';font-weight:500;font-size:54px;color:rgba(255,255,255,.45)}
#lock img.axi{height:150px}
#eTag{left:0;right:0;top:500px;text-align:center;direction:rtl;font-weight:900;font-size:84px}
#eSub{left:0;right:0;top:620px;text-align:center;direction:rtl;font-weight:500;font-size:34px;color:rgba(255,255,255,.72)}
#cta{left:0;right:0;top:720px;display:flex;justify-content:center}
#cta .btn{direction:rtl;display:flex;align-items:center;gap:18px;background:var(--red);border-radius:60px;padding:22px 58px;font-weight:800;font-size:46px;box-shadow:0 12px 40px rgba(228,0,43,.45)}
#cta .btn .arr{font-family:'Inter';font-weight:800}
#disc{left:180px;right:180px;bottom:42px;text-align:center;direction:rtl;font-weight:500;font-size:21px;line-height:1.55;color:rgba(255,255,255,.55)}
</style></head>
<body>
<img id="bug" class="abs" src="axi_iraq_white.png">
<div id="loc" class="abs"><div class="city">بغداد</div><div class="time">٣:٠٧ فجراً</div><div class="rule"></div></div>
<div id="sub" class="abs"></div>
<div id="mt" class="abs"><div class="en"></div><div class="ttl"></div><div class="rule"></div></div>

<div id="ui" class="abs">
  <canvas id="pc" width="1920" height="1080"></canvas>
  <div id="uiHead" class="abs"><div class="cl serif"><img src="claude_orange.png" style="width:70px;height:70px">Claude</div><div class="x">×</div><img class="ai" src="axi_icon.png"></div>
  <div id="card" class="abs">
    <div class="hdr"><div class="l serif"><img src="claude_orange.png" style="width:40px;height:40px">Claude</div><div class="chip"><img src="axi_icon.png" style="width:30px;height:30px;border-radius:8px"><span>متصل بحسابك بـ Axi</span><span class="g"></span></div></div>
    <div id="ub" class="abs"></div>
    <div id="tool" class="abs"><img src="axi_icon.png" style="width:24px;height:24px;border-radius:6px"><span>get_market_data</span><span id="tk"></span></div>
    <div id="ans" class="abs"><div id="a1"></div><div id="a2"></div><div id="a3"></div></div>
    <svg id="spark" class="abs" viewBox="0 0 330 220"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3BE8B0" stop-opacity=".35"/><stop offset="1" stop-color="#3BE8B0" stop-opacity="0"/></linearGradient></defs>
      <path id="spArea" d="" fill="url(#sg)"/><path id="spLine" d="" fill="none" stroke="#3BE8B0" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" x2="330" y1="160" y2="160" stroke="rgba(255,255,255,.25)" stroke-dasharray="6 8"/><text x="4" y="182" fill="rgba(255,255,255,.55)" font-size="16" font-family="Alexandria">دعم</text></svg>
  </div>
</div>

<div id="tag" class="abs"><div class="l1"></div><div class="l2"></div><div class="rule"></div></div>

<div id="end" class="abs">
  <div id="grid" class="abs"></div>
  <svg id="chart" class="abs" viewBox="0 0 1920 1080"><defs><filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path id="chLine" d="" fill="none" stroke="#3BE8B0" stroke-width="3" opacity=".55" filter="url(#gl)"/><circle id="chDot" r="9" fill="#3BE8B0" filter="url(#gl)"/></svg>
  <div id="lock" class="abs"><div class="cl serif"><img src="claude_orange.png">Claude</div><div class="x">×</div><img class="axi" src="axi_iraq_white.png"></div>
  <div id="eTag" class="abs">ما راح تتداول وحدك.</div>
  <div id="eSub" class="abs">خبرة أعظم المتداولين بالعالم… صارت ويّاك</div>
  <div id="cta" class="abs"><div class="btn"><span>سجّل هسه</span><span class="arr">←</span></div></div>
  <div id="disc" class="abs">تحذير المخاطر: تداول عقود الفروقات (CFDs) بالرافعة المالية ينطوي على مخاطر عالية وقد تخسر أموالك. Claude أداة مساعدة للتحليل ولا يقدّم نصائح مالية.</div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const inR=(t,a,b)=>t>=a&&t<b;
const show=(id,on)=>{$(id).style.display=on?'':'none'};
function env(t,a,b,fi=.25,fo=.25){return Math.min(eo(P(t,a,a+fi)),1-P(t,b-fo,b))}
function typeText(s,t,a,b){const c=[...s];return c.slice(0,Math.round(c.length*P(t,a,b))).join('')}
function words(el,t,list,rise=22){ if(el.dataset.k!==list.map(w=>w[0]).join('|')){el.innerHTML=list.map(w=>`<span style="display:inline-block">${w[0]}</span>`).join(' ');el.dataset.k=list.map(w=>w[0]).join('|');}
  [...el.children].forEach((sp,i)=>{const p=eo(P(t,list[i][1],list[i][1]+.3));sp.style.opacity=p;sp.style.transform=`translateY(${(1-p)*rise}px)`;sp.style.filter=`blur(${(1-p)*6}px)`;});}

const SUBS=[[1.00,2.75,'الساعة ثلاثة الفجر…'],[4.25,5.60,'الشاشة حمرة…'],[6.20,7.80,'والقرار بإيدك…'],[8.40,9.70,'وإنت وحدك.'],
 [9.80,12.15,'بس… شلون لو ما تكون وحدك؟'],[12.30,16.00,'شلون لو أعظم المتداولين بالعالم… يگعدون يمّك؟'],
 [28.50,31.20,'كل هالخبرة… صارت بمكان واحد.'],[35.70,38.85,'تسأل… يحلّل… وإنت تقرّر بثقة.']];
const MT=[[16.30,18.62,'NEW YORK','خبرة وول ستريت'],[19.00,21.36,'TOKYO','صبر طوكيو'],[21.70,23.96,'LONDON','دقّة لندن'],[24.35,27.90,'BAGHDAD','وحكمة تجّار بغداد']];

// deterministic particles
const PN=170, parts=[]; let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
for(let i=0;i<PN;i++) parts.push({x:rnd()*1920,y:rnd()*1080,r:.8+rnd()*2.6,v:12+rnd()*40,ph:rnd()*6.28,a:.25+rnd()*.6});
function drawParticles(t,alpha){const c=$('pc').getContext('2d');c.clearRect(0,0,1920,1080);c.globalCompositeOperation='lighter';
  for(const p of parts){const y=((p.y-p.v*t)%1080+1080)%1080, x=p.x+Math.sin(t*.7+p.ph)*18; const a=p.a*alpha*(.6+.4*Math.sin(t*3+p.ph));
    const g=c.createRadialGradient(x,y,0,x,y,p.r*5);g.addColorStop(0,`rgba(255,220,140,${a})`);g.addColorStop(1,'rgba(255,200,100,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,p.r*5,0,6.283);c.fill();}}

// sparkline path
const SP=[150,142,146,130,136,118,124,104,110,92,98,80,86,66,74,58,62,44];
function spark(t){const n=SP.length,pp=P(t,33.25,34.5),k=Math.max(2,Math.round(n*eo(pp)));let d='';for(let i=0;i<k;i++){const x=i*(330/(n-1)),y=SP[i];d+=(i?'L':'M')+x.toFixed(1)+' '+y;}
  $('spLine').setAttribute('d',d);const lx=(k-1)*(330/(n-1));$('spArea').setAttribute('d',d+` L${lx} 220 L0 220 Z`);}
// end chart
const CH=[]; {let y=975; seed=99; for(let i=0;i<=60;i++){y+= (rnd()-.6)*16; y=Math.max(850,Math.min(985,y)); CH.push([60+i*30,y]);}}
function endChart(t){const p=eio(P(t,41.7,43.1)),k=Math.max(2,Math.round(CH.length*p));let d='';for(let i=0;i<k;i++)d+=(i?'L':'M')+CH[i][0]+' '+CH[i][1].toFixed(1);
  $('chLine').setAttribute('d',d);const h=CH[k-1];$('chDot').setAttribute('cx',h[0]);$('chDot').setAttribute('cy',h[1]);$('chDot').style.opacity=p<1?1:.0+.6+.4*Math.sin(t*4);}

const LAYER=new URLSearchParams(location.search).get('layer')||'all';
window.render=function(t){
  if(LAYER==='subs'){['bug','loc','mt','ui','tag','end'].forEach(i=>show(i,false));let s=null;for(const x of SUBS) if(inR(t,x[0],x[1])) s=x;show('sub',!!s);if(s){$('sub').textContent=s[2];$('sub').style.opacity=1;}return;}
  // brand bug
  const bugOn=inR(t,0.6,41.6)&&!inR(t,32,35.6); show('bug',bugOn); if(bugOn) $('bug').style.opacity=.82*env(t,.6,41.6,.6,.4);
  // location stamp
  show('loc',inR(t,.8,3.9)); if(inR(t,.8,3.9)){const p=eo(P(t,.8,1.4));$('loc').style.opacity=env(t,.8,3.9,.4,.4);$('loc').style.transform=`translateY(${(1-p)*14}px)`;$('loc').querySelector('.rule').style.width=(eo(P(t,1.0,2.0))*260)+'px';}
  // subtitles
  let s=null; if(LAYER!=='main') for(const x of SUBS) if(inR(t,x[0],x[1])) s=x; show('sub',!!s);
  if(s){$('sub').textContent=s[2];$('sub').style.opacity=env(t,s[0],s[1],.18,.2);}
  // mentor titles
  let m=null; for(const x of MT) if(inR(t,x[0],x[1])) m=x; show('mt',!!m);
  if(m){const e=env(t,m[0],m[1],.35,.3);$('mt').style.opacity=e;$('mt').querySelector('.en').textContent=m[2];
    const tt=$('mt').querySelector('.ttl');tt.textContent=m[3];const p=eo(P(t,m[0]+.05,m[0]+.6));tt.style.transform=`translateY(${(1-p)*18}px)`;tt.style.filter=`blur(${(1-p)*8}px)`;
    $('mt').querySelector('.rule').style.width=(eo(P(t,m[0]+.2,m[0]+1.0))*420)+'px';$('mt').querySelector('.en').style.letterSpacing=(16-6*eo(P(t,m[0],m[0]+1.2)))+'px';}
  // UI scene 32.0-35.6
  const U=inR(t,32.0,35.6); show('ui',U);
  if(U){drawParticles(t,1);
    const ph=eo(P(t,32.0,32.45));$('uiHead').style.opacity=ph;$('uiHead').style.transform=`translateY(${(1-ph)*-20}px) scale(${.96+.04*ph})`;
    const pc=eo(P(t,32.05,32.5));$('card').style.opacity=pc;$('card').style.transform=`scale(${.93+.07*pc})`;$('card').style.filter=`blur(${(1-pc)*10}px)`;
    const ub='شنو أهم المستويات بالذهب اليوم؟ وشلون أحمي صفقتي؟';$('ub').textContent=typeText(ub,t,32.35,32.95);$('ub').style.opacity=t>32.33?1:0;
    $('tool').style.opacity=eo(P(t,33.0,33.2));$('tk').textContent=t<33.35?'···':'✓';
    $('a1').textContent=typeText('• الاتجاه العام صاعد على الإطار اليومي، بس السوق متذبذب اليوم.',t,33.35,34.15);
    $('a2').textContent=typeText('• أقرب منطقة دعم تحت السعر الحالي — راقبها قبل لا تدخل.',t,34.15,34.85);
    $('a3').textContent=typeText('• حدّد وقف الخسارة وحجم الصفقة حسب رأس مالك.',t,34.85,35.45);
    spark(t);}
  // tagline on S13
  const T=inR(t,39.0,41.6); show('tag',T);
  if(T){$('tag').style.opacity=1-P(t,41.3,41.6);
    words($('tag').querySelector('.l1'),t,[['من',39.10],['اليوم…',39.36]]);
    words($('tag').querySelector('.l2'),t,[['ما',39.93],['راح',40.15],['تتداول',40.34],['وحدك.',40.93]],30);
    $('tag').querySelector('.rule').style.width=(eo(P(t,40.95,41.5))*560)+'px';}
  // end card
  const E=t>=41.6; show('end',E);
  if(E){$('end').style.opacity=eo(P(t,41.6,41.95));endChart(t);
    const pl=eo(P(t,41.85,42.5));$('lock').style.opacity=pl;$('lock').style.transform=`scale(${1.08-.08*pl})`;$('lock').style.filter=`blur(${(1-pl)*10}px)`;
    const p2=eo(P(t,42.35,42.85));$('eTag').style.opacity=p2;$('eTag').style.transform=`translateY(${(1-p2)*24}px)`;
    const p3=eo(P(t,42.65,43.1));$('eSub').style.opacity=p3;
    const p4=eo(P(t,42.9,43.35));const pulse=1+.025*Math.sin(Math.max(0,t-43.4)*5.5);$('cta').style.opacity=p4;$('cta').style.transform=`scale(${(.85+.15*p4)*pulse})`;
    $('disc').style.opacity=eo(P(t,43.2,43.7));}
};
</script></body></html>
