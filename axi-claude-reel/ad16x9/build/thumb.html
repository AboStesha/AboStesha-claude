<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/local.css"><link rel="stylesheet" href="../../fonts/serif_local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:'Alexandria',sans-serif;color:#fff;position:relative}
#bg{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.0) 40%,rgba(0,0,0,.55) 66%,rgba(0,0,0,.88) 100%)}
#lock{position:absolute;left:0;right:0;top:34px;justify-content:center;display:flex;align-items:center;gap:22px;direction:ltr;filter:drop-shadow(0 3px 12px rgba(0,0,0,.6))}
#lock .cl{display:flex;align-items:center;gap:12px;font-family:'Source Serif 4',serif;font-weight:600;font-size:56px}
#lock .cl img{width:58px;height:58px}
#lock .x{font-family:'Inter';font-size:36px;color:rgba(255,255,255,.7)}
#lock .axi{height:92px}
#t{position:absolute;left:0;right:0;bottom:158px;text-align:center;direction:rtl;font-weight:900;font-size:150px;line-height:1.1;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#t span{color:#F6D98B}
#s{position:absolute;left:0;right:0;bottom:70px;text-align:center;direction:rtl;font-weight:500;font-size:40px;color:rgba(255,255,255,.88)}
</style></head><body>
<img id="bg" src="bg.jpg"><div id="shade"></div>
<div id="lock"><div class="cl"><img src="claude_orange.png">Claude</div><div class="x">×</div><img class="axi" src="axi_iraq_white.png"></div>
<div id="t">ما راح تتداول <span>وحدك</span></div>
<div id="s">خبرة أعظم المتداولين بالعالم… صارت ويّاك</div>
</body></html>
