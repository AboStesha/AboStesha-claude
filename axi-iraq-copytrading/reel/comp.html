<style>

:root{--red:#E4002E;--ink:#242528}

.txt{white-space:nowrap;text-align:center}
.ar{direction:rtl;font-family:'Inter','NSA',sans-serif;font-weight:300;letter-spacing:0}
.lat{direction:ltr;font-family:'Inter',sans-serif;font-weight:400;letter-spacing:-.01em}
.w{display:inline-block;margin:0 .12em;position:relative}
.b{font-weight:700}
.m{font-weight:400}
.red{color:var(--red)}
.ink{color:var(--ink)}
.shadow{text-shadow:0 3px 24px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4)}
/* glass, per G-IQ p.43 */
.gD{background:rgba(20,22,26,.72);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1.5px solid rgba(255,255,255,.25);border-radius:18px;color:#fff}

.gL.pill{clip-path:none}.gL.pill::after{display:none}
.gL.op{background:linear-gradient(135deg,rgba(255,255,255,.80),rgba(255,255,255,.64))}
.pad{padding:22px 46px 30px}
.pill{border-radius:999px;padding:10px 44px 16px}
.redpill{background:var(--red);color:#fff;border-radius:999px;padding:12px 52px 18px;font-weight:600}
.chip{display:inline-block;border-radius:999px;padding:6px 22px 9px;font-size:30px;margin:0 6px}
.chipL{background:rgba(255,255,255,.55);color:var(--ink);border:1.5px solid rgba(255,255,255,.8)}
.chipD{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}
.tag{font-family:'Inter','NSA',sans-serif;font-weight:500;font-size:34px;line-height:1.2;opacity:.92;direction:rtl}
.ul::before{content:'';position:absolute;z-index:-1;right:0;bottom:-.02em;height:6px;width:70%;background:var(--red);transform-origin:100% 50%;transform:scaleX(var(--u,0))}

</style>
</head>
<body>

  <canvas id="cv" width="1080" height="1920"></canvas>

<script>
