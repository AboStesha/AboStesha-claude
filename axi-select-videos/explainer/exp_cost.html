const STRIP=s=>s.replace(HARAKA,'');
function words(str,o={}){

    if(tok[0]==='!'){cls+=' red';tok=tok.slice(1);} else if(tok[0]==='~'){cls+=' grey';tok=tok.slice(1);}
    const m=/^([A-Za-z0-9$%+.,\-/]+)([؟،:.]*)$/.exec(tok); const latin=/[A-Za-z0-9$%]/.test(tok)&&!/[؀-ۿ]/.test(tok.replace(/[؟،]/g,''));
    if(latin&&m){ toks.push({cls,txt:m[1],L:true}); if(m[2]) toks.push({cls,txt:m[2],L:false,glue:true}); } else toks.push({cls,txt:tok,L:false}); });
  const out=[]; for(let i=0;i<toks.length;i++){ const k=toks[i];
    if(k.L&&!o.ltr){ let txt=k.txt; while(i+1<toks.length&&toks[i+1].L&&toks[i+1].cls===k.cls){ txt+=' '+toks[++i].txt; } out.push(`<span class="${k.cls} L" dir="ltr">${txt}</span>`); }
    else if(k.glue){ out[out.length-1]+=`<span class="${k.cls}">${k.txt}</span>`; }
    else out.push(k.L?`<span class="${k.cls} L" dir="ltr">${k.txt}</span>`:`<span class="${k.cls}">${k.txt}</span>`); }
  return out.join(' ');
}

    const tp=cue('S06','توصل')-0.2; key(tp,S6K(5)); key(tp+1.5,S6W,ease.quintInOut); EV.push({t:tp,type:'pullback',dur:1.5}); key(T1('S06')-0.55,S6W); }
  go('S07',0,{dip:0.08}); { const t=cue('S07','تنتقل')+0.15; hto(t,t+0.75,'S07.step',ease.expoOut); }
  go('S08',1); { const t=cue('S08','أقصى'); hto(t,t+1.0,'S08.dip',ease.cubicInOut); const tr=cue('S08','يعني')-0.1; hto(tr,tr+1.0,'S08.reb',ease.expoOut); }
  go('S09',0); go('S10',1); go('S11',0);
  // S12 · verbs, then the final climb into the end card (the lockup), dead still for the last seconds
  { const T=T0('S12'); travel(T,C('S12V'),'S12V.rest',{lean:0.011}); const tc=cue('S12','Axi')-0.45; key(tc,C('S12V')); key(tc+1.3,C('S12E'),ease.quintInOut);
    MOVES.push({ta:tc,tb:tc+1.3,dip:0.16,lean:-0.01}); HITS.push([tc+1.3,3]); EV.push({t:tc,type:'whoosh',dur:1.3},{t:tc+1.3,type:'land'});
    hto(tc-0.1,tc+1.15,'S12E.under',ease.quintInOut); hto(tc+1.25,tc+1.75,'S12E.end',ease.expoOut); key(DUR,C('S12E')); }
  KEYS.sort((a,b)=>a.t-b.t);
  for(let i=1;i<HK.length;i++) if(HK[i].t<HK[i-1].t-1e-9) throw new Error('head keys out of order at '+HK[i].t);
  for(let i=1;i<KEYS.length;i++) if(KEYS[i].t===KEYS[i-1].t&&(KEYS[i].x!==KEYS[i-1].x||KEYS[i].zoom!==KEYS[i-1].zoom)) throw new Error('camera keys clash at '+KEYS[i].t);
})();
// cue events for the sound layer
function addEv(){ const E=(t,type,o={})=>EV.push({t,type,...o});
  E(cue('S01','مليون'),'roll',{dur:1.6}); E(cue('S01','Axi'),'impact');
  for(const w of ['المهارة','والمخاطرة','والثبات']) E(cue('S04',w),'fill'); E(cue('S04','خبرتك'),'impact');
  E(cue('S05','وتبدي'),'tick'); E(cue('S05','لخمسين')+0.55,'tick'); E(cue('S05','دولار')+0.1,'tick'); E(cue('S05','تنفتحلك'),'unlock');
  for(const r of ROWS7) E(cue('S07',r[1])+0.35,'tick'); E(cue('S07','تنتقل')+0.1,'press');
  E(cue('S09','بأول')-0.3,'flip'); E(cue('S09','بأول')+0.9,'coin');
  for(const n of NO) E(cue('S10',n[1])+0.12,'x');
  E(cue('S03','تنعكس'),'mirror'); EV.sort((a,b)=>a.t-b.t); }
addEv();

function keyed(t,K){ if(t<=K[0].t) return K[0].s; const L=K.length; if(t>=K[L-1].t) return K[L-1].s; let i=0; while(K[i+1].t<t) i++; const A=K[i],B=K[i+1]; if(B.t<=A.t) return B.s; return lerp(A.s,B.s,(B.curve||ease.linear)(seg(t,A.t,B.t))); }
const headS=t=>keyed(t,HK);
function camAt(t){
  const c=OM.camera(t,KEYS); let {x,y,zoom,rot}=c;
  for(const m of MOVES){ if(t>m.ta&&t<m.tb){ const u=seg(t,m.ta,m.tb), b=Math.sin(Math.PI*ease.sineInOut(u)); zoom*=1-m.dip*b; rot+=m.lean*b; } }
  for(const [th,amp] of HITS){ const tau=t-th; if(tau>0&&tau<0.6){ const s=OM.shake(t,th,{amp,decay:9,freq:15,seed:Math.round(th*100)}), env=1-sstep(0.3,0.6,tau); x+=s.x*env/zoom; y+=s.y*env/zoom; rot+=s.rot*env; } }
  return {x,y,zoom,rot};
}

// ════════════════════════════════════════════ HUD: the lockup (assembles in S01, rides the corner, lands on the end card) + chapter index ════════════════════════════════════════════
const LGP=[['a',0],['x',312],['i',640],['tag',770]];
LOGO.innerHTML=LGP.map(([n,x])=>`<img id="lg_${n}" src="${IMG}logo_${n}.png" style="left:${x}px">`).join('');
const LG_EL=LGP.map(([n])=>$('lg_'+n));
const LR={c:{x:960-1728*0.39/2,y:470-384*0.39/2,s:0.39}, u:{x:960-1728*0.31/2,y:262-384*0.31/2,s:0.31}, k:{x:72,y:48,s:30/384}, e:{x:LG.x,y:LG.y,s:LG.s}};
function logoRect(t){ const ta=cue('S01','Axi'), tu=cue('S01','تمويل')-0.45, T=T1('S01'), te=cue('S12','Axi')-0.45;
  const mix=(A,B,k)=>({x:lerp(A.x,B.x,k),y:lerp(A.y,B.y,k),s:Math.exp(lerp(Math.log(A.s),Math.log(B.s),k))});
  let r=LR.c; if(t>=tu) r=mix(LR.c,LR.u,ssstep(tu,tu+0.75,t)); if(t>=T-0.55) r=mix(LR.u,LR.k,ease.quintInOut(seg(t,T-0.55,T+0.75))); if(t>=te) r=mix(LR.k,LR.e,ease.quintInOut(seg(t,te,te+1.3)));
  return {...r,op:t<ta-0.05?0:1}; }
function drawLogo(t){ const r=logoRect(t); css(LOGO,'display',r.op>0?'':'none'); if(!r.op) return r;
  css(LOGO,'transform',`translate(${f2(r.x)}px,${f2(r.y)}px) scale(${r.s.toFixed(5)})`);
  const ta=cue('S01','Axi'), tg=cue('S01','Select');
  for(let i=0;i<3;i++){ const d=t-ta-i*0.07>SET?{op:1,y:0,sx:1,sy:1}:OM.letterDrop(t,ta,i,{stagger:0.07,dist:150}); const el=LG_EL[i];
    css(el,'opacity',d.op>=0.999?'1':d.op.toFixed(3)); css(el,'transform',d.y===0&&d.sx===1?'none':`translate(0,${f2(d.y)}px) scale(${f4(d.sx)},${f4(d.sy)})`); css(el,'transformOrigin','50% 100%'); }
  const kg=tw(t,tg,tg+0.55,ease.expoOut), ig=imp(t,tg+0.5,{sqx:0.05,sqy:0.07}); const el=LG_EL[3];
  css(el,'opacity',t<tg?'0':Math.min(1,kg*2).toFixed(3)); css(el,'transform',kg>=1&&ig.r===0?'none':`translate(${f2((1-kg)*300)}px,0) scale(${f4(ig.sx)},${f4(ig.sy)})`); css(el,'transformOrigin','0% 70%');
  return r; }
const IDX=ST.filter(S=>S.id!=='S01'&&S.id!=='S12E').map(S=>{ const sc=SC[S.scene]; const n=String(TL.scenes.indexOf(sc)+1).padStart(2,'0');
  const d=document.createElement('div'); d.className='idx'; d.innerHTML=`<span class="n w">${n}</span><span class="d w"></span><span class="tt">${words(sc.title_ar)}</span>`; HUD.appendChild(d);
  return {el:d,t0:sc.t0+0.45,t1:S.id==='S12V'?cue('S12','Axi')-0.6:sc.t1-0.62}; });
function drawIdx(t){ for(const o of IDX){ const vis=t>=o.t0-0.01&&t<o.t1+0.4; css(o.el,'display',vis?'':'none'); if(!vis) continue;
  const l=lift(t,o.t1,{dist:14,dur:0.3}); css(o.el,'opacity',l.op>=1?'1':l.op.toFixed(3)); css(o.el,'transform',l.k>0?`translateY(${f2(l.dy)}px)`:'none');
  animW(o.el,o.t0,t,{dt:0.05,dist:14}); } }

// ════════════════════════════════════════════ GROUND: charcoal top light, the deck's red tick grid far back, blurred candles in depth ════════════════════════════════════════════
const bgC=$('bg'), lnC=$('ln'), grC=$('grain'); let DPR=1, BG, LN;
const FARS=[]; const CHARTS=['chart_c','chart_b','chart_d','chart_e','chart_wide_blur'];
function buildFar(){ const f=1/1.6; ST.forEach((S,i)=>{ const cx=S.ox+960+(S.wide?800:0), cy=S.oy+540+(S.wide?160:0); const fx=960+(cx-960)*f, fy=540+(cy-540)*f;
    const im=document.createElement('img'); im.src=IMG+CHARTS[i%CHARTS.length]+'.webp'; const w=S.wide?2600:1750; im.className='abs'; css(im,'width',w+'px');
    const x=fx-w/2+(i%2?260:-140), y=fy-330+(i%3)*60; css(im,'left',x+'px'); css(im,'top',y+'px'); css(im,'opacity',(S.farOp??(i===0?0.5:0.3)).toFixed(2)); FAR.appendChild(im); FARS.push({im,x,y,w,h:w*0.51}); }); }
let GRD=null;
function drawGround(cam){ const c=BG; c.setTransform(DPR,0,0,DPR,0,0); c.fillStyle='#060607'; c.fillRect(0,0,W,H);
  if(!GRD){ GRD=c.createRadialGradient(960,-260,80,960,-260,1500); GRD.addColorStop(0,'rgba(58,59,62,.62)'); GRD.addColorStop(0.45,'rgba(30,31,33,.32)'); GRD.addColorStop(1,'rgba(6,6,7,0)'); }
  c.fillStyle=GRD; c.fillRect(0,0,W,H);
  const G=OM.lattice(cam,{depth:1.2,spacing:66,px:1.4}); const M=G.matrix; c.fillStyle='rgba(228,0,46,.26)'; c.beginPath();
  for(let x=G.x0;x<=G.x1;x+=G.spacing) for(let y=G.y0;y<=G.y1;y+=G.spacing){ const [sx,sy]=OM.project(M,x,y); if(sx<-8||sx>W+8||sy<-8||sy>H+12) continue;
    c.moveTo(sx,sy); c.lineTo(sx+2.6,sy-7); c.lineTo(sx+5.4,sy-7); c.lineTo(sx+2.8,sy); c.closePath(); }
  c.fill(); }
function drawGrain(){ const c=grC.getContext('2d',{willReadFrequently:true}); const w=256, d=c.createImageData(w,w), r=OM.rng(77); for(let i=0;i<w*w;i++){ const v=r()<0.5?0:255; d.data[i*4]=v; d.data[i*4+1]=v; d.data[i*4+2]=v; d.data[i*4+3]=Math.floor(r()*7); }
  const tile=document.createElement('canvas'); tile.width=tile.height=w; tile.getContext('2d').putImageData(d,0,0); const pat=c.createPattern(tile,'repeat'); c.fillStyle=pat; c.fillRect(0,0,grC.width,grC.height); }

// ════════════════════════════════════════════ THE LINE (screen-space canvas through the camera) ════════════════════════════════════════════
let HEAD=[0,0], HEADV=false;
function drawLine(t,Mv,z){ const c=LN; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,W,H);
  for(const S of ST) if(S.vis&&S.decor) S.decor(c,Mv,z,t);
  const s=headS(t); HEADV=false; if(s<=0.5) return;
  let n=1; while(n<PL.length-1&&PL[n]<s) n++; const u=clamp((s-PL[n-1])/Math.max(1e-6,PL[n]-PL[n-1]));
  const hx=lerp(PX[n-1],PX[n],u), hy=lerp(PY[n-1],PY[n],u);
  const sp=[]; for(let i=0;i<n;i++) sp.push(OM.project(Mv,PX[i],PY[i])); const hp=OM.project(Mv,hx,hy); sp.push(hp);
  const wAt=i=>i<n?PW[i]:PW[n];
  for(const pass of [0,1]){ let i=1; while(i<sp.length){ const w=wAt(i); let j=i; while(j+1<sp.length&&wAt(j+1)===w) j++;
      c.beginPath(); c.moveTo(sp[i-1][0],sp[i-1][1]); for(let k=i;k<=j;k++) c.lineTo(sp[k][0],sp[k][1]);
      c.lineCap=w>5?'butt':'round'; c.lineJoin='round';
      if(pass===0){ c.strokeStyle='rgba(228,0,46,.16)'; c.lineWidth=(w+(w>5?6:8))*z; } else { c.strokeStyle='#E4002E'; c.lineWidth=w*z; }
      c.stroke(); i=j+1; } }
  for(const S of ST) if(S.vis&&S.decorTop) S.decorTop(c,Mv,z,t);
  // the live price: a hot dot at the head (gone once the line has ended in the chamfer)
  const end=MS('S12E.end'), dop=s>=end-0.5?1-sstep(0,0.45,t-(HK[HK.length-1].t)):1;
  if(dop>0.002){ const g=c.createRadialGradient(hp[0],hp[1],0,hp[0],hp[1],22*z); g.addColorStop(0,`rgba(255,40,80,${0.55*dop})`); g.addColorStop(1,'rgba(228,0,46,0)');
    c.fillStyle=g; c.beginPath(); c.arc(hp[0],hp[1],22*z,0,Math.PI*2); c.fill(); c.fillStyle=`rgba(255,255,255,${dop})`; c.beginPath(); c.arc(hp[0],hp[1],4.6*z,0,Math.PI*2); c.fill(); }
  HEAD=hp; HEADV=true; }

// ════════════════════════════════════════════ SEEK ════════════════════════════════════════════
let CAM=null, VIEW=null; const pendingFar=[];
function visBox(Mv,S){ const b=OM.projectBox(Mv,{x:S.ox-160,y:S.oy-200,w:S.bw+320,h:S.bh+360}); return b.x<W&&b.y<H&&b.x+b.w>0&&b.y+b.h>0; }
function seek(t){
  t=clamp(t,0,DUR); CAM=camAt(t); const Mv=OM.view(CAM); VIEW=Mv; const z=CAM.zoom;
  css(WORLD,'transform',`matrix(${Mv.map((v,i)=>i<4?v.toFixed(6):v.toFixed(3)).join(',')})`);
  const Mf=OM.view(CAM,{depth:0.6}); css(FAR,'transform',`matrix(${Mf.map((v,i)=>i<4?v.toFixed(6):v.toFixed(3)).join(',')})`);
  for(const F of FARS){ const b=OM.projectBox(Mf,{x:F.x,y:F.y,w:F.w,h:F.h}), v=b.x<W&&b.y<H&&b.x+b.w>0&&b.y+b.h>0; css(F.im,'display',v?'':'none'); if(v) pendingFar.push(F.im.decode().catch(()=>{})); }
  drawGround(CAM);
  const pending=pendingFar.splice(0);
  for(const S of ST){ const v=visBox(Mv,S); S.vis=v; css(S.el,'display',v?'':'none'); if(v){ S.draw(t); for(const im of S.imgs) pending.push(im.decode().catch(()=>{})); } }
  drawLine(t,Mv,z);
  if(drawLogo(t).op) for(const im of LG_EL) pending.push(im.decode().catch(()=>{})); drawIdx(t);
  $('hudt').textContent='t='+t.toFixed(2)+'  '+TL.scenes.filter(s=>t>=s.t0&&t<s.t1).map(s=>s.id).join('');
  return Promise.all(pending);
}

// ════════════════════════════════════════════ CONTRACT ════════════════════════════════════════════
ST.forEach(S=>{ const d=document.createElement('div'); d.className='st'; d.id='st_'+S.id; css(d,'left',S.ox+'px'); css(d,'top',S.oy+'px'); css(d,'width',S.bw+'px'); css(d,'height',S.bh+'px');
  d.innerHTML=S.html(); WORLD.appendChild(d); S.el=d; S.imgs=[...d.querySelectorAll('img')]; });
buildFar();
window.__meta={dur:DUR,fps:FPS,w:W,h:H,cuts:[],inFrame:{logo:[20.4,DUR],head:[0.2,3.2]}};
window.__events=()=>EV.map(e=>({...e}));
function trackAt(t){ const o={}; const box=el=>{ const r=el.getBoundingClientRect(); return {x:r.left,y:r.top,w:r.width,h:r.height,op:1}; };
  if(HEADV) o.head={x:HEAD[0]-6,y:HEAD[1]-6,w:12,h:12,op:1};
  const r=logoRect(t); if(r.op) o.logo={x:r.x,y:r.y,w:1728*r.s,h:384*r.s,op:1};
  for(const S of ST) if(S.vis&&S.track){ const tr=S.track(); for(const k in tr){ const el=tr[k]; const op=parseFloat(getComputedStyle(el).opacity); if(op>0.05) o[k]={...box(el),op}; } }
  return o; }
window.__track=t=>trackAt(t);
window.__motion=(t0,t1)=>{ const c0=camAt(t0), c1=camAt(t1), cm=camAt((t0+t1)/2); let d=OM.screenTravel(c0,c1,cm);
  const l0=logoRect(t0), l1=logoRect(t1); d=Math.max(d,Math.hypot(l1.x-l0.x,l1.y-l0.y)+Math.abs(l1.s-l0.s)*1728);
  const h0=headS(t0), h1=headS(t1); d=Math.max(d,Math.abs(h1-h0)*cm.zoom);
  for(const e of CUEALL){ if(e>t0-1.0&&e<t1+0.05){ d=Math.max(d,36); break; } }
  return d; };
const CUEALL=[]; TL.scenes.forEach(s=>s.w.forEach(([w,t])=>CUEALL.push(t)));
window.__seek=async t=>{ await seek(t); return true; };
window.__ready=(async()=>{
  DPR=window.devicePixelRatio||1; for(const c of [bgC,lnC,grC]){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); } BG=bgC.getContext('2d',{willReadFrequently:true}); LN=lnC.getContext('2d',{willReadFrequently:true});
  await Promise.all(['700 40px Alex','800 40px Alex','600 40px Alex','400 40px Plex','500 40px Plex','700 40px Plex','300 40px Geist','400 40px Geist','500 40px Geist'].map(f=>document.fonts.load(f,'ابجد abc 0123')));
  await document.fonts.ready;
  ST.forEach(S=>S.init&&S.init());
  const ims=[...document.querySelectorAll('img')]; await Promise.all(ims.map(im=>im.decode().catch(()=>{})));
  drawGrain(); await seek(0); return true; })();
const q=new URLSearchParams(location.search);
if(q.has('t')) __ready.then(()=>seek(parseFloat(q.get('t'))));
if(q.has('hud')) $('hudt').style.display='block';
if(q.has('play')) __ready.then(()=>{ const t0=performance.now(), off=parseFloat(q.get('from')||'0'); (function loop(){ seek((off+(performance.now()-t0)/1000)%DUR); requestAnimationFrame(loop); })(); });
</script>
