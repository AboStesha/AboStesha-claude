    <pattern id="solar" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#2a2a30"/><line x1="0" y1="0" x2="0" y2="18" stroke="#8fa3c9" stroke-width="5" opacity=".55"/></pattern>
