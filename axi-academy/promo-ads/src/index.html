<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Axi Academy — social ad</title>
<style>
  @font-face { font-family: AR; font-weight: 200; src: url(../assets/fonts/readex-pro-arabic-200-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
  @font-face { font-family: AR; font-weight: 300; src: url(../assets/fonts/readex-pro-arabic-300-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
  @font-face { font-family: AR; font-weight: 400; src: url(../assets/fonts/readex-pro-arabic-400-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
  @font-face { font-family: AR; font-weight: 600; src: url(../assets/fonts/readex-pro-arabic-600-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
  @font-face { font-family: AR; font-weight: 700; src: url(../assets/fonts/readex-pro-arabic-700-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
  @font-face { font-family: IN; font-weight: 300; src: url(../assets/fonts/inter-latin-300-normal.woff2) format('woff2'); }
  @font-face { font-family: IN; font-weight: 400; src: url(../assets/fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: IN; font-weight: 600; src: url(../assets/fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: IN; font-weight: 700; src: url(../assets/fonts/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: IN; font-weight: 800; src: url(../assets/fonts/inter-latin-800-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; } canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../assets/lockup.js"></script>
<script src="../assets/brand_paths.js"></script>
<script src="kit.js"></script>
<script>
  // ?film=ad1|ad2 · ?t=seconds renders one frame · ?play loops in real time
  const q = new URLSearchParams(location.search);
  const FILM_ID = (q.get('film') || 'ad1').replace(/[^a-z0-9_]/g, '');
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const sub = document.createElement('canvas'); sub.width = 1080; sub.height = 1920; const sx = sub.getContext('2d');
  window.ready = (async () => {
    const faces = [['AR', 200], ['AR', 300], ['AR', 400], ['AR', 600], ['AR', 700], ['IN', 300], ['IN', 400], ['IN', 600], ['IN', 700], ['IN', 800]];
    await Promise.all(faces.map(([f, w]) => document.fonts.load(`${w} 40px ${f}`, f === 'AR' ? 'أكاديمية آكسي لگتلك سجّل' : '$50 axi.com/ar 0123456789')));
    await document.fonts.ready;
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = FILM_ID + '.js'; s.onload = res; s.onerror = () => rej(new Error('no film ' + FILM_ID)); document.body.appendChild(s); });
    return true;
  })();
  const SHUTTER = 0.5 / 60;
  window.renderAt = (t, maxN) => {
    const N = Math.max(1, Math.min(maxN || 16, FILM.blur ? FILM.blur(t) : 1));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (N === 1) { FILM.draw(ctx, t); return true; }
    for (let i = 0; i < N; i++) {
      const ts = t + ((i + 0.5) / N - 0.5) * SHUTTER;
      sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalAlpha = 1; sx.globalCompositeOperation = 'source-over'; FILM.draw(sx, ts);
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(sub, 0, 0);
    }
    ctx.globalAlpha = 1; return true;
  };
  window.ready.then(() => {
    if (q.has('t')) renderAt(parseFloat(q.get('t')));
    if (q.has('play')) { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % FILM.duration, 1); requestAnimationFrame(loop); }; loop(); }
  });
</script>
</body>
</html>
