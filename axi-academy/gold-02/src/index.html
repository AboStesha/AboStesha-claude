<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../assets/brand_paths.js"></script>
<script src="engine.js"></script>
<script src="fx.js"></script>
<script src="glass.js"></script>
<script src="goldkit.js"></script>
<script src="thread.js"></script>
<script src="words.js"></script>
<script src="film.js"></script>
<script src="kit.js"></script>
<script src="brand.js"></script>
<script src="shot.js"></script>
<script src="s1.js"></script>
<script src="s2.js"></script>
<script src="s3.js"></script>
<script>
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const q = new URLSearchParams(location.search);
  window.SAMPLES = parseInt(q.get('samples') || '6', 10);
  window.ready = (async () => {
    const faces = [['AR', 200], ['AR', 300], ['AR', 400], ['AR', 600], ['AR', 700], ['IN', 300], ['IN', 400], ['IN', 600], ['IN', 700], ['IN', 800]];
    await Promise.all(faces.map(([f, w]) => document.fonts.load(`${w} 40px ${f}`, f === 'AR' ? 'استراتيجية' : 'EUR/USD 1.0842')));
    await document.fonts.ready;
    return true;
  })();
  window.renderAt = (t, n) => { FILM.frame(ctx, t, { samples: n || window.SAMPLES }); return true; };
  window.ready.then(() => {
    if (q.has('t')) renderAt(parseFloat(q.get('t')));
    if (q.has('play')) { const t0 = performance.now() - (parseFloat(q.get('from') || 0) * 1000); const loop = () => { renderAt((performance.now() - t0) / 1000, 1); requestAnimationFrame(loop); }; loop(); }
  });
</script>
</body>
