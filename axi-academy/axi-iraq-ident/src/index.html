<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Axi Iraq — logo ident</title>
<style>
  @font-face { font-family: IN; font-weight: 400; src: url(../assets/fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: IN; font-weight: 600; src: url(../assets/fonts/inter-latin-600-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; } canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../assets/logo.js"></script>
<script src="kit.js"></script>
<script>
  // ?film=a|b|c  ·  ?t=seconds renders one frame  ·  ?play loops in real time
  const q = new URLSearchParams(location.search);
  const FILM_ID = (q.get('film') || 'a').replace(/[^a-z0-9_]/g, '');
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const sub = document.createElement('canvas'); sub.width = 1080; sub.height = 1920; const sx = sub.getContext('2d');
  window.ready = Promise.all([
    document.fonts.load('400 40px IN'), document.fonts.load('600 40px IN'),
    new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'film_' + FILM_ID + '.js'; s.onload = res; s.onerror = () => rej(new Error('no film ' + FILM_ID)); document.body.appendChild(s); }),
  ]).then(() => true);
  const SHUTTER = 0.5 / 60;  // 180-degree shutter
  window.renderAt = (t, maxN) => {
    const N = Math.max(1, Math.min(maxN || 16, FILM.blur ? FILM.blur(t) : 1));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    if (N === 1) { FILM.draw(ctx, t); return true; }
    for (let i = 0; i < N; i++) {
      const ts = t + ((i + 0.5) / N - 0.5) * SHUTTER;
      sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalAlpha = 1; sx.globalCompositeOperation = 'source-over'; sx.filter = 'none'; FILM.draw(sx, ts);
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(sub, 0, 0);
    }
    ctx.globalAlpha = 1; return true;
  };
  window.ready.then(() => {
    if (q.has('t')) renderAt(parseFloat(q.get('t')));
    if (q.has('play')) { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % FILM.duration, 1); requestAnimationFrame(loop); }; loop(); }
  });
</script>
</body>
</html>
