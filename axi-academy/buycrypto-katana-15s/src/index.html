<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Axi Iraq — Buy Crypto · 15 s hyper-edit</title>
<style>
  /* variable fonts, so type can morph through every weight: Readex Pro 160–700 (Arabic), Inter 100–900 (Latin and digits) */
  @font-face { font-family: AR; font-weight: 160 700; src: url(fonts/ReadexPro-VF.ttf) format('truetype'); unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
  @font-face { font-family: IN; font-weight: 100 900; src: url(fonts/Inter-VF.ttf) format('truetype'); }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #090A0D; } canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib/logo.js"></script>
<script src="lib/kit.js"></script>
<script src="lib/glass.js"></script>
<script src="lib/cc.js"></script>
<script src="film.js"></script>
<script>
  // Katana page contract: hfPage.render(t, f) draws frame f (t = f / 60) from t alone.
  // Motion blur: FILM.blur(t) samples spread over FILM.shutter(t) and averaged; samples never cross a cut in FILM.cuts.
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const sub = document.createElement('canvas'); sub.width = 1080; sub.height = 1920; const sx = sub.getContext('2d');
  const ready = (async () => {
    const faces = [['AR', 160], ['AR', 300], ['AR', 400], ['AR', 600], ['AR', 700], ['IN', 300], ['IN', 500], ['IN', 600], ['IN', 700], ['IN', 800]];
    await Promise.all(faces.map(([f, w]) => document.fonts.load(`${w} 40px ${f}`, f === 'AR' ? 'امتلكها فعلاً محفظة آكسي' : 'Buy Crypto BTC 1:1 200+ 24/7 0.8%')));
    await document.fonts.ready;
    FILM.init();
    return true;
  })();
  function segment(t) { let a = 0, b = FILM.duration; for (const c of FILM.cuts) { if (c <= t) a = c; else { b = c; break; } } return [a, b]; }
  function renderAt(t) {
    const N = Math.max(1, Math.min(16, FILM.blur(t))), S = FILM.shutter(t), [a, b] = segment(t);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (N === 1) FILM.draw(ctx, t);
    else for (let i = 0; i < N; i++) {
      const ts = Math.min(b - 1e-4, Math.max(a, t + ((i + 0.5) / N - 0.5) * S));
      sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalAlpha = 1; sx.globalCompositeOperation = 'source-over'; FILM.draw(sx, ts);
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(sub, 0, 0);
    }
    ctx.globalAlpha = 1; FILM.post(ctx, t);
  }
  window.hfPage = { width: 1080, height: 1920, fps: 60, frames: 900, ready, audio: 'audio/mix.m4a', render: (t) => renderAt(t) };
  // in a browser: ?t=seconds draws that frame
  const q = new URLSearchParams(location.search);
  if (q.has('t')) ready.then(() => renderAt(parseFloat(q.get('t'))));
</script>
</body>
</html>
